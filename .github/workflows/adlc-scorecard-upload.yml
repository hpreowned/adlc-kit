# Reusable: publish this repo's trend as an artifact the org aggregator collects.
name: adlc-scorecard-upload
on:
  workflow_call:
    inputs:
      kit-ref: { type: string, default: "v0.1.2" }
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install --python 3.12 "git+https://github.com/kestrel-freight/adlc-kit@${{ inputs.kit-ref }}"
      - run: adlc scorecard --trend --results monitor --out monitor/trend.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: adlc-scorecard-${{ github.repository_id }}
          path: monitor/
