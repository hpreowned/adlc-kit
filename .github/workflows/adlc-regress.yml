# Reusable: weekly + on tool bumps. Runs the 5-task smoke set on the winning arm, 3 runs,
# appends monitor/trend.jsonl. Needs COPILOT_GITHUB_TOKEN as a repo/org secret.
name: adlc-regress
on:
  workflow_call:
    inputs:
      kit-ref: { type: string, default: "v0.1.3" }
      arm: { type: string, default: "graphify" }
      setup: { type: string, default: "" }   # shell to install the repo's own toolchain (JDK, .NET, …) before the smoke set
    secrets:
      COPILOT_GITHUB_TOKEN: { required: true }
jobs:
  regress:
    runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GRAPHIFY_BACKEND: none
      GRAPHIFY_NO_TIPS: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Caches: the kit ref pins graphify and the Serena commit, so it is the only key that
      # matters for uv; Copilot CLI has its own version; Serena's language servers land in
      # ~/.serena on the first smoke run and are saved post-job for the next week.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/tools
          key: adlc-uv-${{ runner.os }}-${{ inputs.kit-ref }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: adlc-npm-${{ runner.os }}-copilot-1.0.105
      - uses: actions/cache@v4
        with:
          path: ~/.serena/language_servers
          key: adlc-ls-${{ runner.os }}-${{ inputs.kit-ref }}-${{ hashFiles('.serena/project.yml') }}
          restore-keys: adlc-ls-${{ runner.os }}-${{ inputs.kit-ref }}-
      - run: npm install -g @github/copilot@1.0.105   # pinned; see PINS.md
      - run: uv tool install --python 3.12 "git+https://github.com/kestrel-freight/adlc-kit@${{ inputs.kit-ref }}"
      - name: repo toolchain
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - run: adlc regress --arm ${{ inputs.arm }} --runs 3 --out monitor/trend.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: adlc-trend-${{ github.repository_id }}
          path: monitor/trend.jsonl
